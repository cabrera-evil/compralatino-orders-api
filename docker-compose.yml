# Standalone orders-api; run with `--env-file ../compralatino-infra/.env` so shared credentials match compralatino-infra (`docker compose --profile infra up -d` there).
services:
  orders-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: compralatino-orders-api
    container_name: compralatino_orders_api
    restart: unless-stopped
    networks:
      - compralatino_net
    env_file:
      - .env
    environment:
      PORT: 3000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CACHE_ENABLED: 'true'
      CACHE_STORE: redis
      QUEUE_ENABLED: 'true'
      THROTTLE_STORAGE: redis
      THROTTLE_TRUST_PROXY: 'true'
      RABBITMQ_ENABLED: 'true'
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-compralatino}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      RABBITMQ_EXCHANGE: compralatino_events
      DATABASE_URL: postgresql://${POSTGRES_USER:-compralatino}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-compralatino}?schema=orders_svc
      RABBITMQ_QUEUE: orders_svc_queue
    ports:
      - '3003:3000'
    labels:
      - traefik.enable=true
      - traefik.http.routers.orders-api.rule=(Host(`api.localhost`) || Host(`traefik`)) && PathPrefix(`/orders/`)
      - traefik.http.routers.orders-api.entrypoints=web
      - traefik.http.routers.orders-api.middlewares=orders-api-strip
      - traefik.http.middlewares.orders-api-strip.stripprefix.prefixes=/orders
      - traefik.http.services.orders-api.loadbalancer.server.port=3000
      - traefik.http.routers.orders-api-v1.rule=(Host(`api.localhost`) || Host(`traefik`)) && (PathPrefix(`/api/v1/orders`) || PathPrefix(`/api/v1/cart`) || PathPrefix(`/api/v1/checkout-options`))
      - traefik.http.routers.orders-api-v1.entrypoints=web
      - traefik.http.routers.orders-api-v1.service=orders-api

networks:
  compralatino_net:
    external: true
    name: compralatino_net
